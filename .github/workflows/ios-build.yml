name: ZinoAgent 2.0 iOS Build & IPA Pipeline

# Builds, tests, archives, and exports ZinoAgent 2.0 on GitHub Actions macOS runners
# so the project can be developed without owning a Mac.
#
# Build modes (workflow_dispatch):
#   all               - Simulator build + Unit/Integration tests + unsigned device IPA + signed IPA (if secrets present)
#   simulator         - Unsigned iOS Simulator .app (compile check)
#   test              - Build and execute Unit + Integration tests on an iPad Simulator
#   unsigned-device   - Unsigned iPadOS/iOS .ipa (NOT directly installable without re-signing via Sideloadly/AltStore)
#   development-ipa   - Signed Development .ipa (requires signing secrets)
#   distribution-ipa  - Signed Ad-Hoc / App Store .ipa (requires signing secrets)
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'Documentation/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build target mode'
        type: choice
        default: all
        options:
          - all
          - simulator
          - test
          - unsigned-device
          - development-ipa
          - distribution-ipa

concurrency:
  group: zinoagent-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLAMA_CPP_TAG: b12020
  PROJECT_NAME: ZinoAgent
  SCHEME_NAME: ZinoAgent

jobs:
  ios-build:
    name: iPadOS / iOS (${{ github.event.inputs.build_mode || 'all' }})
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD_MODE: ${{ github.event.inputs.build_mode || 'all' }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          echo "Selecting Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen & CMake
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Cache llama.xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Packages/ZinoLlama/Frameworks/llama.xcframework
          key: llama-xcframework-${{ env.LLAMA_CPP_TAG }}-${{ hashFiles('scripts/build-llama-xcframework.sh') }}

      - name: Build llama.xcframework (Metal, iOS Device + Simulator)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-llama-xcframework.sh
          bash scripts/build-llama-xcframework.sh

      - name: Generate ZinoAgent.xcodeproj via XcodeGen
        run: |
          chmod +x scripts/generate-xcodeproj.sh
          bash scripts/generate-xcodeproj.sh

      - name: Cache SwiftPM source packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Packages/ZinoLlama/Package.swift') }}

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages"

      - name: Build for iOS Simulator (Compile Verification)
        if: env.BUILD_MODE == 'all' || env.BUILD_MODE == 'simulator'
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee simulator-build.log | tail -n 120
          grep -q "\*\* BUILD SUCCEEDED \*\*" simulator-build.log
          mkdir -p artifacts
          cd "${DERIVED_DATA}/Build/Products/Debug-iphonesimulator"
          zip -qry "${GITHUB_WORKSPACE}/artifacts/ZinoAgent-iOS-Simulator.app.zip" "${PROJECT_NAME}.app"

      - name: Upload Simulator Build Artifact
        if: env.BUILD_MODE == 'all' || env.BUILD_MODE == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: ZinoAgent-iOS-Simulator-App
          path: artifacts/ZinoAgent-iOS-Simulator.app.zip
          retention-days: 14

      - name: Run Unit & Integration Tests on iPad Simulator
        if: env.BUILD_MODE == 'all' || env.BUILD_MODE == 'test'
        run: |
          set -o pipefail
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          candidates = []
          for runtime, devs in data.items():
              if 'iOS' not in runtime: continue
              for d in devs:
                  if d.get('isAvailable') and 'iPad' in d.get('name', ''):
                      candidates.append((runtime, d['name'], d['udid']))
          candidates.sort(reverse=True)
          print(candidates[0][2] if candidates else '')
          ")
          if [[ -z "$SIM_UDID" ]]; then
            echo "No iPad simulator found; falling back to first available iOS simulator."
            SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
            import json, sys
            data = json.load(sys.stdin)['devices']
            for runtime, devs in sorted(data.items(), reverse=True):
                if 'iOS' not in runtime: continue
                for d in devs:
                    if d.get('isAvailable'):
                        print(d['udid']); sys.exit(0)
            ")
          fi
          echo "Running tests on Simulator UDID: $SIM_UDID"
          xcodebuild test \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Debug \
            -destination "id=${SIM_UDID}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages" \
            -resultBundlePath "${GITHUB_WORKSPACE}/artifacts/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-run.log | tail -n 160

      - name: Upload Test Results
        if: always() && (env.BUILD_MODE == 'all' || env.BUILD_MODE == 'test')
        uses: actions/upload-artifact@v4
        with:
          name: ZinoAgent-Test-Results
          path: |
            artifacts/TestResults.xcresult
            test-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Unsigned Device Archive & IPA (Requires Re-Signing Before Install)
        if: env.BUILD_MODE == 'all' || env.BUILD_MODE == 'unsigned-device'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${GITHUB_WORKSPACE}/build/ZinoAgent-unsigned.xcarchive" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee unsigned-archive.log | tail -n 120
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" unsigned-archive.log

          mkdir -p build/Payload artifacts
          cp -R "${GITHUB_WORKSPACE}/build/ZinoAgent-unsigned.xcarchive/Products/Applications/${PROJECT_NAME}.app" build/Payload/
          cd build && zip -qry "${GITHUB_WORKSPACE}/artifacts/ZinoAgent-2.0-unsigned.ipa" Payload

      - name: Upload Unsigned Device IPA
        if: env.BUILD_MODE == 'all' || env.BUILD_MODE == 'unsigned-device'
        uses: actions/upload-artifact@v4
        with:
          name: ZinoAgent-2.0-Unsigned-IPA-Requires-Resigning
          path: artifacts/ZinoAgent-2.0-unsigned.ipa
          retention-days: 14

      - name: Archive & Export Signed IPA (Development / Distribution)
        if: |
          (env.BUILD_MODE == 'all' && env.HAS_SIGNING == 'true') ||
          env.BUILD_MODE == 'development-ipa' ||
          env.BUILD_MODE == 'distribution-ipa'
        env:
          IOS_CERT_P12_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_IDENTIFIER || 'com.zinoagent.app' }}
          USE_INCREASED_MEMORY: ${{ secrets.IOS_INCREASED_MEMORY_LIMIT || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_CERT_P12_B64}" || -z "${IOS_PROFILE_B64}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "::error::Signing secrets (IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID) are required for a signed IPA."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/zino-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_CERT_P12_B64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          EXPORT_METHOD="development"
          SIGN_STYLE="Apple Development"
          if [[ "${BUILD_MODE}" == "distribution-ipa" ]]; then
            EXPORT_METHOD="${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}"
            SIGN_STYLE="Apple Distribution"
          fi

          EXTRA_ARGS=()
          if [[ "$USE_INCREASED_MEMORY" == "true" ]]; then
            EXTRA_ARGS+=("CODE_SIGN_ENTITLEMENTS=ZinoAgent/Resources/ZinoAgent.entitlements")
          fi

          xcodebuild archive \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "${GITHUB_WORKSPACE}/build/ZinoAgent-signed.xcarchive" \
            -derivedDataPath "${DERIVED_DATA}" \
            -clonedSourcePackagesDirPath "${DERIVED_DATA}/SourcePackages" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$SIGN_STYLE" \
            "${EXTRA_ARGS[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${GITHUB_WORKSPACE}/build/ZinoAgent-signed.xcarchive" \
            -exportPath "${GITHUB_WORKSPACE}/artifacts/signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$CERT_PATH" "$PROFILE_PATH"

      - name: Upload Signed IPA Artifact
        if: |
          (env.BUILD_MODE == 'all' && env.HAS_SIGNING == 'true') ||
          env.BUILD_MODE == 'development-ipa' ||
          env.BUILD_MODE == 'distribution-ipa'
        uses: actions/upload-artifact@v4
        with:
          name: ZinoAgent-2.0-Signed-IPA
          path: artifacts/signed-export/*.ipa
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-diagnostic-logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7
